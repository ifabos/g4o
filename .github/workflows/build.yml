name: Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.24'
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-mingw-w64 python3
    
    - name: Run Go tests
      run: go test ./...
    
    - name: Build for Linux
      run: make linux
    
    - name: Build for Windows
      run: make windows
    
    - name: Run integration tests
      run: ./test_library.sh
    
    - name: Create package
      run: make package
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: g4n-libraries
        path: build/package/

  release:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.24'
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-mingw-w64
    
    - name: Build release
      run: make all
    
    - name: Create package
      run: make package
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          build/g4n.dll
          build/libcommon4n.so
          include/g4n.h
        body: |
          ## g4n Math Library Release
          
          This release includes:
          - Windows library (g4n.dll)
          - Linux library (libcommon4n.so)
          - C header file (g4n.h)
          - Examples for VB.NET, VB6, C, and Python
          
          See the README.md for usage instructions.
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
